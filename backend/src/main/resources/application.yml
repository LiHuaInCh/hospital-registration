server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hospital?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hospital.entity,com.hospital.vo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET:hospital-registration-jwt-secret-key-2024}
    expire-hours: 72
  booking:
    # 就诊前多少小时之后不允许取消
    cancel-limit-hours: 2
    # 患者端可预约的天数（含今天）
    bookable-days: 7

logging:
  level:
    com.hospital.mapper: debug
